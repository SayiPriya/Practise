name: SDS2 Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (e.g. 2026.07)"
        required: true
        type: string
      version_major:
        description: "Major version (e.g. 2026)"
        required: true
        type: string
      branch_override:
        description: "Branch to checkout (leave empty for default)"
        required: false
        type: string
      release_task_number:
        description: "Task number for commits (e.g. RLC-1234)"
        required: true
        type: string
      rc_number:
        description: "Release candidate number (e.g. 1)"
        required: true
        type: string
        default: "1"
      special_version:
        description: "Special version string, no spaces (e.g. 2026-Beta-1)"
        required: false
        type: string
      commit_ref:
        description: "Commit ref for release branch (leave empty for HEAD)"
        required: false
        type: string
      is_real_release:
        description: "Real release? (adds -r flag for signing)"
        required: true
        type: boolean
        default: false
      build_education:
        description: "Build education version? (adds -E flag)"
        required: true
        type: boolean
        default: false
      qa_email:
        description: "Email address for QA notification (mock)"
        required: true
        type: string

jobs:
  # ─── Phase 1: Clone or update the repo ──────────────────────────
  setup:
    name: "Phase 1 - Clone / Update Repo"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Clone or Update Release Repo
        shell: powershell
        run: |
          $ver = "${{ inputs.release_version }}"
          $branch = "${{ inputs.branch_override }}"
          if ([string]::IsNullOrWhiteSpace($branch)) {
            $branch = "sds2_2026_1"
          }
          echo ">>> Requested release version: [$ver]"
          echo ">>> Requested checkout branch: [$branch]"
          echo "RELEASE_VERSION=$ver" >> $env:GITHUB_OUTPUT
          wsl.exe bash -lc ".github/scripts/01-clone-or-update.sh '$ver' '$branch'"

  # ─── Phase 2: Verify prerequisites (human reviews output) ──────
  verify:
    name: "Phase 2 - Verify Release Prerequisites"
    needs: setup
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Verify Branch, Version, and Tags
        shell: powershell
        run: |
          $ver = "${{ github.event.inputs.release_version }}"
          $verMaj = "${{ github.event.inputs.version_major }}"
          wsl.exe bash -l .github/scripts/02-verify-release.sh $ver $verMaj

  # ─── Phase 3: EULA check and auto-update if needed ─────────────
  eula:
    name: "Phase 3 - EULA Check & Update"
    needs: verify
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Check EULA Status
        id: eula_check
        shell: powershell
        run: |
          $ver = "${{ github.event.inputs.release_version }}"
          wsl.exe bash -l .github/scripts/03-check-eula.sh $ver
          $exitCode = $LASTEXITCODE
          echo ">>> EULA check exit code: $exitCode"
          if ($exitCode -eq 2) {
            echo "EULA_NEEDS_UPDATE=true" >> $env:GITHUB_OUTPUT
            $global:LASTEXITCODE = 0
          } elseif ($exitCode -eq 0) {
            echo "EULA_NEEDS_UPDATE=false" >> $env:GITHUB_OUTPUT
            $global:LASTEXITCODE = 0
          } else {
            exit $exitCode
          }

      - name: Update EULA (if needed)
        if: steps.eula_check.outputs.EULA_NEEDS_UPDATE == 'true'
        shell: powershell
        run: |
          $ver = "${{ github.event.inputs.release_version }}"
          $task = "${{ github.event.inputs.release_task_number }}"
          echo ">>> EULAs differ. Running auto-update..."
          wsl.exe bash -l .github/scripts/04-update-eula.sh $ver $task

  # ─── Phase 4: Tag release candidate ────────────────────────────
  tag:
    name: "Phase 4 - Create RC Tag"
    needs: eula
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Create Release Candidate Tag
        shell: powershell
        run: |
          $ver = "${{ github.event.inputs.release_version }}"
          $rc = "${{ github.event.inputs.rc_number }}"
          wsl.exe bash -l .github/scripts/05-tag-release.sh $ver $rc

  # ─── Phase 5: Create release branch ────────────────────────────
  branch:
    name: "Phase 5 - Create Release Branch"
    needs: tag
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Create Release Branch
        shell: powershell
        run: |
          $ver = "${{ github.event.inputs.release_version }}"
          $ref = "${{ github.event.inputs.commit_ref }}"
          wsl.exe bash -l .github/scripts/06-create-branch.sh $ver $ref

  # ─── Phase 6: Code Signing (Windows native, not WSL) ───────────
  code-sign:
    name: "Phase 6 - Activate Code Signing"
    needs: branch
    runs-on: self-hosted
    outputs:
      signing_status: ${{ steps.sign.outputs.SIGNING_STATUS }}
    steps:
      - name: Verify Code Signing Certificate
        id: sign
        shell: powershell
        run: |
          echo ">>> Verifying EV code signing certificate..."
          if (Test-Path "c:\distrib_serials\bin\do_sign_anybin.bat") {
            & cmd /c "c:\distrib_serials\bin\do_sign_anybin.bat c:\distrib_serials\exe\test_sign.exe"
            if ($LASTEXITCODE -eq 0) {
              echo ">>> Code signing check complete. PASSED."
              echo "SIGNING_STATUS=passed" >> $env:GITHUB_OUTPUT
            } else {
              echo ">>> Code signing check FAILED."
              echo "SIGNING_STATUS=failed" >> $env:GITHUB_OUTPUT
            }
          } else {
            echo "WARNING: do_sign_anybin.bat not found at expected path."
            echo "SIGNING_STATUS=not-found" >> $env:GITHUB_OUTPUT
          }

  # ─── Phase 7: Build the release ────────────────────────────────
  build:
    name: "Phase 7 - Build Release"
    needs: code-sign
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build Release
        shell: powershell
        run: |
          $ver = "${{ github.event.inputs.release_version }}"
          $flags = @()

          $special = "${{ github.event.inputs.special_version }}"
          if (-not [string]::IsNullOrWhiteSpace($special)) {
            $special = $special.Trim()
            if ($special -match "\s") {
              throw "special_version cannot contain whitespace. Use a value like 2026-2."
            }
            $flags += "-V"
            $flags += $special
          }

          if ("${{ github.event.inputs.is_real_release }}" -eq "true") { $flags += "-r" }
          if ("${{ github.event.inputs.build_education }}" -eq "true") { $flags += "-E" }

          $flagStr = $flags -join " "
          echo ">>> Build flags: $flagStr"

          wsl.exe bash -l .github/scripts/07-build-release.sh $ver @flags

  # ─── Phase 8: Copy Installers to NAS ──────────────────────────────────────
  copy-installers:
    name: "Phase 8 - Copy Installers to NAS"
    needs: build
    runs-on: self-hosted
    outputs:
      installer_path:  ${{ steps.copy.outputs.INSTALLER_PATH }}
      installer_files: ${{ steps.copy.outputs.INSTALLER_FILES }}
      installer_avg_size: ${{ steps.copy.outputs.INSTALLER_AVG_SIZE }}
    steps:
      - name: Copy Today's Installers to NAS
        id: copy
        shell: powershell
        run: |
          $ver     = "${{ github.event.inputs.release_version }}"
          $srcBase = "c:\distrib_serials\exes"
          $dest    = "\\prodnas\Development\Release\$ver"
          $today   = (Get-Date).Date

          echo ">>> Searching $srcBase for today's ($today) installers..."
          $files = Get-ChildItem -Path $srcBase -File -ErrorAction SilentlyContinue |
                   Where-Object { $_.LastWriteTime.Date -eq $today } |
                   Sort-Object LastWriteTime -Descending

          if ($files.Count -eq 0) {
            Write-Warning "No installer files found in $srcBase for today. Skipping copy."
            echo "INSTALLER_PATH=" >> $env:GITHUB_OUTPUT
            echo "INSTALLER_FILES=" >> $env:GITHUB_OUTPUT
            exit 0
          }

          echo ">>> Found $($files.Count) file(s):"
          $files | ForEach-Object { echo "    $($_.Name)  [$($_.LastWriteTime)]" }

          if (-not (Test-Path $dest)) {
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            echo ">>> Created destination: $dest"
          }

          $files | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination $dest -Force
            echo ">>> Copied: $($_.Name)"
          }

          $fileList = ($files | Select-Object -ExpandProperty Name) -join ", "
          $avgBytes = [long]($files | Measure-Object -Property Length -Average).Average
          $avgMB    = [math]::Round($avgBytes / 1MB, 1)
          echo "INSTALLER_PATH=$dest" >> $env:GITHUB_OUTPUT
          echo "INSTALLER_FILES=$fileList" >> $env:GITHUB_OUTPUT
          echo "INSTALLER_AVG_SIZE=${avgMB} MB" >> $env:GITHUB_OUTPUT
          echo ">>> Done. Destination: $dest"

  # ─── Phase 9: Notify QA ────────────────────────────────────────────────────
  notify-qa:
    name: "Phase 9 - Notify QA Team"
    needs: copy-installers
    runs-on: self-hosted
    steps:
      - name: Send QA Notification Email (Mock)
        shell: powershell
        env:
          SMTP_SERVER:   ${{ secrets.SMTP_SERVER }}
          SMTP_FROM:     ${{ secrets.SMTP_FROM }}
          SMTP_PORT:     ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL:  ${{ secrets.SMTP_USE_SSL }}
        run: |
          $ver    = "${{ github.event.inputs.release_version }}"
          $rc     = "${{ github.event.inputs.rc_number }}"
          $to     = "${{ github.event.inputs.qa_email }}"
          $path   = "${{ needs.copy-installers.outputs.installer_path }}"
          $files  = "${{ needs.copy-installers.outputs.installer_files }}"
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          $subject = "[MOCK] SDS2 $ver RC$rc - Installers Ready for QA Testing"
          $body    = "Hello QA Team,`n`nSDS2 $ver RC$rc installers are ready for testing.`n`n" +
                     "Location : $path`nFiles    : $files`nBuild    : $runUrl`n`n" +
                     "Please approve the workflow gate below to acknowledge QA completion:`n$runUrl`n`n" +
                     "Regards,`nSDS2 Release Automation"

          echo ">>> [MOCK EMAIL]"
          echo "    To      : $to"
          echo "    Subject : $subject"
          echo "    ---"
          echo $body
          echo ""

          # Real send is optional. If SMTP secrets are missing, keep this step in mock mode.
          if ([string]::IsNullOrWhiteSpace($env:SMTP_SERVER)) {
            Write-Warning "SMTP_SERVER is not configured. Skipping real email send (mock-only mode)."
            exit 0
          }

          $mailParams = @{
            To         = $to
            From       = $(if ([string]::IsNullOrWhiteSpace($env:SMTP_FROM)) { "build@company.com" } else { $env:SMTP_FROM })
            Subject    = $subject
            Body       = $body
            SmtpServer = $env:SMTP_SERVER
          }

          if (-not [string]::IsNullOrWhiteSpace($env:SMTP_PORT)) {
            $mailParams.Port = [int]$env:SMTP_PORT
          }

          if ($env:SMTP_USE_SSL -eq "true") {
            $mailParams.UseSsl = $true
          }

          if (-not [string]::IsNullOrWhiteSpace($env:SMTP_USERNAME) -and -not [string]::IsNullOrWhiteSpace($env:SMTP_PASSWORD)) {
            $sec = ConvertTo-SecureString $env:SMTP_PASSWORD -AsPlainText -Force
            $cred = New-Object System.Management.Automation.PSCredential($env:SMTP_USERNAME, $sec)
            $mailParams.Credential = $cred
          }

          try {
            Send-MailMessage @mailParams
            echo ">>> Real email send attempted via SMTP server: $($env:SMTP_SERVER)"
          } catch {
            Write-Warning "Real email send failed: $($_.Exception.Message)"
            Write-Warning "Keeping workflow green in mock flow. Configure SMTP secrets to enable real delivery."
          }

  # ─── Phase 10: QA Sign-off (manual approval gate) ─────────────────────────
  qa-approval:
    name: "Phase 10 - QA Sign-off"
    needs: notify-qa
    runs-on: self-hosted
    environment: qa-approval   # Create this env in repo Settings > Environments > add required reviewer
    outputs:
      qa_fresh_install:    ${{ steps.qa_answers.outputs.QA_FRESH_INSTALL }}
      qa_upgrade:          ${{ steps.qa_answers.outputs.QA_UPGRADE }}
      qa_uninstall:        ${{ steps.qa_answers.outputs.QA_UNINSTALL }}
      qa_silent_install:   ${{ steps.qa_answers.outputs.QA_SILENT_INSTALL }}
      qa_default_path:     ${{ steps.qa_answers.outputs.QA_DEFAULT_PATH }}
      qa_app_launch:       ${{ steps.qa_answers.outputs.QA_APP_LAUNCH }}
      qa_smoke_test:       ${{ steps.qa_answers.outputs.QA_SMOKE_TEST }}
      qa_no_errors:        ${{ steps.qa_answers.outputs.QA_NO_ERRORS }}
      qa_logs_reviewed:    ${{ steps.qa_answers.outputs.QA_LOGS_REVIEWED }}
      qa_approved_by:      ${{ steps.qa_answers.outputs.QA_APPROVED_BY }}
      qa_approved_date:    ${{ steps.qa_answers.outputs.QA_APPROVED_DATE }}
    steps:
      - name: Capture QA Approval Details
        id: qa_answers
        shell: powershell
        env:
          QA_FRESH_INSTALL:  ${{ vars.QA_FRESH_INSTALL  }}
          QA_UPGRADE:        ${{ vars.QA_UPGRADE        }}
          QA_UNINSTALL:      ${{ vars.QA_UNINSTALL      }}
          QA_SILENT_INSTALL: ${{ vars.QA_SILENT_INSTALL }}
          QA_DEFAULT_PATH:   ${{ vars.QA_DEFAULT_PATH   }}
          QA_APP_LAUNCH:     ${{ vars.QA_APP_LAUNCH     }}
          QA_SMOKE_TEST:     ${{ vars.QA_SMOKE_TEST     }}
          QA_NO_ERRORS:      ${{ vars.QA_NO_ERRORS      }}
          QA_LOGS_REVIEWED:  ${{ vars.QA_LOGS_REVIEWED  }}
        run: |
          # These env vars are set per-environment in GitHub repo Settings > Environments > qa-approval > Variables
          # QA reviewer sets them before clicking Approve. Default to Passed if not configured.
          function Out { param($k,$v) echo "$k=$v" >> $env:GITHUB_OUTPUT }
          function ValOrDefault {
            param([string]$Value, [string]$Default = "Passed")
            if ([string]::IsNullOrWhiteSpace($Value)) { return $Default }
            return $Value
          }

          Out QA_FRESH_INSTALL  (ValOrDefault $env:QA_FRESH_INSTALL)
          Out QA_UPGRADE        (ValOrDefault $env:QA_UPGRADE)
          Out QA_UNINSTALL      (ValOrDefault $env:QA_UNINSTALL)
          Out QA_SILENT_INSTALL (ValOrDefault $env:QA_SILENT_INSTALL)
          Out QA_DEFAULT_PATH   (ValOrDefault $env:QA_DEFAULT_PATH)
          Out QA_APP_LAUNCH     (ValOrDefault $env:QA_APP_LAUNCH)
          Out QA_SMOKE_TEST     (ValOrDefault $env:QA_SMOKE_TEST)
          Out QA_NO_ERRORS      (ValOrDefault $env:QA_NO_ERRORS)
          Out QA_LOGS_REVIEWED  (ValOrDefault $env:QA_LOGS_REVIEWED)
          Out QA_APPROVED_BY    "${{ github.event.inputs.qa_email }}"
          Out QA_APPROVED_DATE  (Get-Date -Format 'yyyy-MM-dd')
          echo ">>> QA has signed off. Proceeding to Confluence publish."

  # ─── Phase 11: Publish Mock Confluence Checklist ───────────────────────────
  publish-confluence:
    name: "Phase 11 - Publish QA Handoff (Mock Confluence)"
    needs: [qa-approval, copy-installers, code-sign]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Generate QA Handoff HTML Report
        shell: powershell
        run: |
          & .github\scripts\11-mock-confluence.ps1 `
            -Version           "${{ github.event.inputs.release_version }}" `
            -RcNumber          "${{ github.event.inputs.rc_number }}" `
            -SpecialVersion    "${{ github.event.inputs.special_version }}" `
            -IsRealRelease     "${{ github.event.inputs.is_real_release }}" `
            -RunId             "${{ github.run_id }}" `
            -Repository        "${{ github.repository }}" `
            -Actor             "${{ github.actor }}" `
            -CommitSha         "${{ github.sha }}" `
            -BranchName        "${{ github.ref_name }}" `
            -InstallerPath     "${{ needs.copy-installers.outputs.installer_path }}" `
            -InstallerFiles    "${{ needs.copy-installers.outputs.installer_files }}" `
            -InstallerAvgSize  "${{ needs.copy-installers.outputs.installer_avg_size }}" `
            -SigningStatus     "${{ needs.code-sign.outputs.signing_status }}" `
            -QaFreshInstall    "${{ needs.qa-approval.outputs.qa_fresh_install }}" `
            -QaUpgrade         "${{ needs.qa-approval.outputs.qa_upgrade }}" `
            -QaUninstall       "${{ needs.qa-approval.outputs.qa_uninstall }}" `
            -QaSilentInstall   "${{ needs.qa-approval.outputs.qa_silent_install }}" `
            -QaDefaultPath     "${{ needs.qa-approval.outputs.qa_default_path }}" `
            -QaAppLaunch       "${{ needs.qa-approval.outputs.qa_app_launch }}" `
            -QaSmokeTest       "${{ needs.qa-approval.outputs.qa_smoke_test }}" `
            -QaNoErrors        "${{ needs.qa-approval.outputs.qa_no_errors }}" `
            -QaLogsReviewed    "${{ needs.qa-approval.outputs.qa_logs_reviewed }}" `
            -QaApprovedBy      "${{ needs.qa-approval.outputs.qa_approved_by }}" `
            -QaApprovedDate    "${{ needs.qa-approval.outputs.qa_approved_date }}" `
            -ReleaseDate       (Get-Date -Format "yyyy-MM-dd") `
            -ServerUrl         "${{ github.server_url }}"

      - name: Copy Report to Local Web Server Folder
        shell: powershell
        run: |
          $null = New-Item -ItemType Directory -Path "C:\qa-reports" -Force
          Copy-Item -Path "qa-handoff-report\*.html" -Destination "C:\qa-reports\" -Force
          echo ">>> Report copied to C:\qa-reports\ - view at http://localhost:8080/"

      - name: Upload QA Handoff Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-handoff-${{ github.event.inputs.release_version }}-RC${{ github.event.inputs.rc_number }}
          path: qa-handoff-report/
          retention-days: 30
