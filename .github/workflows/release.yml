name: SDS2 Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (e.g. 2026.07)"
        required: true
        type: string
      version_major:
        description: "Major version (e.g. 2026)"
        required: true
        type: string
      branch_override:
        description: "Branch to checkout (leave empty for default)"
        required: false
        type: string
      release_task_number:
        description: "Task number for commits (e.g. RLC-1234)"
        required: true
        type: string
      rc_number:
        description: "Release candidate number (e.g. 1)"
        required: true
        type: string
        default: "1"
      special_version:
        description: "Special version string, no spaces (e.g. 2026-Beta-1)"
        required: false
        type: string
      commit_ref:
        description: "Commit ref for release branch (leave empty for HEAD)"
        required: false
        type: string
      is_real_release:
        description: "Real release? (adds -r flag for signing)"
        required: true
        type: boolean
        default: false
      build_education:
        description: "Build education version? (adds -E flag)"
        required: true
        type: boolean
        default: false
      qa_email:
        description: "Email address for QA notification (mock)"
        required: true
        type: string

jobs:
  # ─── Phase 1: Clone or update the repo ──────────────────────────
  setup:
    name: "Phase 1 - Clone / Update Repo"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Clone or Update Release Repo
        shell: powershell
        run: |
          $ver = "${{ inputs.release_version }}"
          $branch = "${{ inputs.branch_override }}"
          if ([string]::IsNullOrWhiteSpace($branch)) {
            $branch = "sds2_2026_1"
          }
          echo ">>> Requested release version: [$ver]"
          echo ">>> Requested checkout branch: [$branch]"
          echo "RELEASE_VERSION=$ver" >> $env:GITHUB_OUTPUT
          wsl.exe bash -lc ".github/scripts/01-clone-or-update.sh '$ver' '$branch'"

  # ─── Phase 2: Verify prerequisites (human reviews output) ──────
  verify:
    name: "Phase 2 - Verify Release Prerequisites"
    needs: setup
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Verify Branch, Version, and Tags
        shell: powershell
        run: |
          $ver = "${{ github.event.inputs.release_version }}"
          $verMaj = "${{ github.event.inputs.version_major }}"
          wsl.exe bash -l .github/scripts/02-verify-release.sh $ver $verMaj

  # ─── Phase 3: EULA check and auto-update if needed ─────────────
  eula:
    name: "Phase 3 - EULA Check & Update"
    needs: verify
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Check EULA Status
        id: eula_check
        shell: powershell
        run: |
          $ver = "${{ github.event.inputs.release_version }}"
          wsl.exe bash -l .github/scripts/03-check-eula.sh $ver
          $exitCode = $LASTEXITCODE
          echo ">>> EULA check exit code: $exitCode"
          if ($exitCode -eq 2) {
            echo "EULA_NEEDS_UPDATE=true" >> $env:GITHUB_OUTPUT
            $global:LASTEXITCODE = 0
          } elseif ($exitCode -eq 0) {
            echo "EULA_NEEDS_UPDATE=false" >> $env:GITHUB_OUTPUT
            $global:LASTEXITCODE = 0
          } else {
            exit $exitCode
          }

      - name: Update EULA (if needed)
        if: steps.eula_check.outputs.EULA_NEEDS_UPDATE == 'true'
        shell: powershell
        run: |
          $ver = "${{ github.event.inputs.release_version }}"
          $task = "${{ github.event.inputs.release_task_number }}"
          echo ">>> EULAs differ. Running auto-update..."
          wsl.exe bash -l .github/scripts/04-update-eula.sh $ver $task

  # ─── Phase 4: Tag release candidate ────────────────────────────
  tag:
    name: "Phase 4 - Create RC Tag"
    needs: eula
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Create Release Candidate Tag
        shell: powershell
        run: |
          $ver = "${{ github.event.inputs.release_version }}"
          $rc = "${{ github.event.inputs.rc_number }}"
          wsl.exe bash -l .github/scripts/05-tag-release.sh $ver $rc

  # ─── Phase 5: Create release branch ────────────────────────────
  branch:
    name: "Phase 5 - Create Release Branch"
    needs: tag
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Create Release Branch
        shell: powershell
        run: |
          $ver = "${{ github.event.inputs.release_version }}"
          $ref = "${{ github.event.inputs.commit_ref }}"
          wsl.exe bash -l .github/scripts/06-create-branch.sh $ver $ref

  # ─── Phase 6: Code Signing (Windows native, not WSL) ───────────
  code-sign:
    name: "Phase 6 - Activate Code Signing"
    needs: branch
    runs-on: self-hosted
    steps:
      - name: Verify Code Signing Certificate
        shell: powershell
        run: |
          echo ">>> Verifying EV code signing certificate..."
          if (Test-Path "c:\distrib_serials\bin\do_sign_anybin.bat") {
            & cmd /c "c:\distrib_serials\bin\do_sign_anybin.bat c:\distrib_serials\exe\test_sign.exe"
            echo ">>> Code signing check complete."
          } else {
            echo "WARNING: do_sign_anybin.bat not found at expected path."
            echo "Ensure the code signing certificate is active before proceeding."
          }

  # ─── Phase 7: Build the release ────────────────────────────────
  build:
    name: "Phase 7 - Build Release"
    needs: code-sign
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build Release
        shell: powershell
        run: |
          $ver = "${{ github.event.inputs.release_version }}"
          $flags = @()

          $special = "${{ github.event.inputs.special_version }}"
          if (-not [string]::IsNullOrWhiteSpace($special)) {
            $special = $special.Trim()
            if ($special -match "\s") {
              throw "special_version cannot contain whitespace. Use a value like 2026-2."
            }
            $flags += "-V"
            $flags += $special
          }

          if ("${{ github.event.inputs.is_real_release }}" -eq "true") { $flags += "-r" }
          if ("${{ github.event.inputs.build_education }}" -eq "true") { $flags += "-E" }

          $flagStr = $flags -join " "
          echo ">>> Build flags: $flagStr"

          wsl.exe bash -l .github/scripts/07-build-release.sh $ver @flags

  # ─── Phase 8: Copy Installers to NAS ──────────────────────────────────────
  copy-installers:
    name: "Phase 8 - Copy Installers to NAS"
    needs: build
    runs-on: self-hosted
    outputs:
      installer_path:  ${{ steps.copy.outputs.INSTALLER_PATH }}
      installer_files: ${{ steps.copy.outputs.INSTALLER_FILES }}
    steps:
      - name: Copy Today's Installers to NAS
        id: copy
        shell: powershell
        run: |
          $ver     = "${{ github.event.inputs.release_version }}"
          $srcBase = "c:\distrib_serials\exes"
          $dest    = "\\prodnas\Development\Release\$ver"
          $today   = (Get-Date).Date

          echo ">>> Searching $srcBase for today's ($today) installers..."
          $files = Get-ChildItem -Path $srcBase -File -ErrorAction SilentlyContinue |
                   Where-Object { $_.LastWriteTime.Date -eq $today } |
                   Sort-Object LastWriteTime -Descending

          if ($files.Count -eq 0) {
            Write-Warning "No installer files found in $srcBase for today. Skipping copy."
            echo "INSTALLER_PATH=" >> $env:GITHUB_OUTPUT
            echo "INSTALLER_FILES=" >> $env:GITHUB_OUTPUT
            exit 0
          }

          echo ">>> Found $($files.Count) file(s):"
          $files | ForEach-Object { echo "    $($_.Name)  [$($_.LastWriteTime)]" }

          if (-not (Test-Path $dest)) {
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            echo ">>> Created destination: $dest"
          }

          $files | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination $dest -Force
            echo ">>> Copied: $($_.Name)"
          }

          $fileList = ($files | Select-Object -ExpandProperty Name) -join ", "
          echo "INSTALLER_PATH=$dest" >> $env:GITHUB_OUTPUT
          echo "INSTALLER_FILES=$fileList" >> $env:GITHUB_OUTPUT
          echo ">>> Done. Destination: $dest"

  # ─── Phase 9: Notify QA ────────────────────────────────────────────────────
  notify-qa:
    name: "Phase 9 - Notify QA Team"
    needs: copy-installers
    runs-on: self-hosted
    steps:
      - name: Send QA Notification Email (Mock)
        shell: powershell
        run: |
          $ver    = "${{ github.event.inputs.release_version }}"
          $rc     = "${{ github.event.inputs.rc_number }}"
          $to     = "${{ github.event.inputs.qa_email }}"
          $path   = "${{ needs.copy-installers.outputs.installer_path }}"
          $files  = "${{ needs.copy-installers.outputs.installer_files }}"
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          $subject = "[MOCK] SDS2 $ver RC$rc - Installers Ready for QA Testing"
          $body    = "Hello QA Team,`n`nSDS2 $ver RC$rc installers are ready for testing.`n`n" +
                     "Location : $path`nFiles    : $files`nBuild    : $runUrl`n`n" +
                     "Please approve the workflow gate below to acknowledge QA completion:`n$runUrl`n`n" +
                     "Regards,`nSDS2 Release Automation"

          echo ">>> [MOCK EMAIL]"
          echo "    To      : $to"
          echo "    Subject : $subject"
          echo "    ---"
          echo $body
          echo ""
          echo "NOTE: Uncomment Send-MailMessage and configure SMTP secrets to send real email."
          # Send-MailMessage -To $to -From "build@company.com" `
          #   -Subject $subject -Body $body -SmtpServer "smtp.company.com"

  # ─── Phase 10: QA Sign-off (manual approval gate) ─────────────────────────
  qa-approval:
    name: "Phase 10 - QA Sign-off"
    needs: notify-qa
    runs-on: self-hosted
    environment: qa-approval   # Create this env in repo Settings > Environments > add required reviewer
    steps:
      - name: QA Approval Acknowledged
        shell: powershell
        run: |
          echo ">>> QA has signed off. Proceeding to Confluence publish."

  # ─── Phase 11: Publish Mock Confluence Checklist ───────────────────────────
  publish-confluence:
    name: "Phase 11 - Publish QA Handoff (Mock Confluence)"
    needs: [qa-approval, copy-installers]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Generate QA Handoff HTML Report
        shell: powershell
        run: |
          & .github\scripts\11-mock-confluence.ps1 `
            -Version        "${{ github.event.inputs.release_version }}" `
            -RcNumber       "${{ github.event.inputs.rc_number }}" `
            -SpecialVersion "${{ github.event.inputs.special_version }}" `
            -IsRealRelease  "${{ github.event.inputs.is_real_release }}" `
            -RunId          "${{ github.run_id }}" `
            -Repository     "${{ github.repository }}" `
            -Actor          "${{ github.actor }}" `
            -CommitSha      "${{ github.sha }}" `
            -BranchName     "${{ github.ref_name }}" `
            -InstallerPath  "${{ needs.copy-installers.outputs.installer_path }}" `
            -InstallerFiles "${{ needs.copy-installers.outputs.installer_files }}" `
            -ReleaseDate    (Get-Date -Format "yyyy-MM-dd") `
            -ServerUrl      "${{ github.server_url }}"

      - name: Upload QA Handoff Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-handoff-${{ github.event.inputs.release_version }}-RC${{ github.event.inputs.rc_number }}
          path: qa-handoff-report/
          retention-days: 30
